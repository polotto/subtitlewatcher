name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so no go.sum to key the cache
      - run: go vet ./...
      - run: go test ./...

  dist:
    needs: test
    # macOS has lipo, used to build one universal binary for Intel and Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so no go.sum to key the cache
      - name: Build archives
        env:
          # The key only goes into tagged releases, never into PR artifacts.
          OPENSUBTITLES_API_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.OPENSUBTITLES_API_KEY || '' }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0-${GITHUB_SHA::7}; fi
          scripts/dist.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: subtitlewatcher
          path: dist/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
